<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#9a3042" />
  <meta name="description" content="Interactive Vietnamese for partners and in-laws, with separate Northern and Southern learning tracks." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vietnamese Family" />
  <title>Vietnamese for Family · 10-Lesson Course</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="course.css" />
  <link rel="stylesheet" href="lesson-8.css" />
  <link rel="stylesheet" href="lesson-9.css" />
  <link rel="stylesheet" href="lesson-10.css" />
  <link rel="stylesheet" href="mobile.css" />
  <link rel="stylesheet" href="hero-tuning.css" />
  <link rel="stylesheet" href="shell-layout.css" />
  <link rel="stylesheet" href="southern-practice.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Vietnamese for Family home">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span>
        <strong>Vietnamese for Family</strong>
        <small>Learn the Vietnamese your family speaks.</small>
      </span>
    </a>

    <div class="header-actions">
      <div class="top-dialect-panel" aria-label="Accent settings">
        <span class="top-dialect-label">Accent</span>
        <div class="segmented" role="group" aria-label="Primary accent">
          <button class="dialect-button" type="button" data-dialect="north">Northern</button>
          <button class="dialect-button" type="button" data-dialect="south">Southern</button>
        </div>
        <span id="dialect-summary" class="top-dialect-summary"></span>
      </div>

      <button id="lesson-menu-button" class="lesson-menu-button" type="button" aria-controls="lesson-sidebar" aria-expanded="false">
        <span class="lesson-menu-icon" aria-hidden="true"><span></span></span>
        <span>Lessons</span>
      </button>
    </div>
  </header>

  <aside id="lesson-sidebar" class="lesson-sidebar" aria-label="Course lessons" aria-hidden="true">
    <div class="sidebar-head">
      <div class="sidebar-head-copy">
        <small>Course</small>
        <strong>10 lessons</strong>
      </div>
      <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Close lessons">×</button>
    </div>
    <div id="lesson-badge" class="sidebar-current-lesson">Lesson 1 · Meeting the Family</div>
    <nav id="course-nav" class="course-nav" aria-label="Course lessons"></nav>
  </aside>
  <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close lessons" tabindex="-1"></button>

  <main id="top">
    <section class="hero page-shell">
      <div class="hero-copy">
        <p id="hero-eyebrow" class="eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p id="hero-text" class="hero-text"></p>
      </div>
    </section>

    <section class="page-shell status-strip" aria-label="Lesson status">
      <div>
        <span class="status-label">Lesson progress</span>
        <strong id="progress-text">0%</strong>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
      <button id="reset-progress" class="text-button" type="button">Reset this lesson</button>
    </section>

    <section id="audio-note" class="page-shell audio-note" aria-label="Audio information">
      <span aria-hidden="true">🔊</span>
      <p><strong>Audio:</strong> <span id="audio-status"></span></p>
    </section>

    <div id="lesson-root" class="page-shell lesson-stack"></div>
  </main>

  <footer class="site-footer page-shell">
    <p>Vietnamese for Family · V0.11 · Southern free response beta</p>
    <p>Built for real conversations with your Vietnamese family.</p>
  </footer>

  <script src="course-data.js"></script>
  <script src="lesson-2.js"></script>
  <script src="lesson-7.js"></script>
  <script src="lesson-8.js"></script>
  <script src="lesson-9.js"></script>
  <script src="lesson-10.js"></script>
  <script src="regional-pronouns.js"></script>
  <script src="regional-sanity.js"></script>
  <script src="southern-gold-set-v1-l1.js"></script>
  <script src="southern-gold-set-v1-l2.js"></script>
  <script src="southern-gold-set-v1-l3.js"></script>
  <script src="southern-gold-set-v1-l4.js"></script>
  <script src="southern-gold-set-v1-l5.js"></script>
  <script src="app.js"></script>
  <script src="audio-fix.js"></script>
  <script src="lesson-8-ui.js"></script>
  <script src="lesson-9-ui.js"></script>
  <script src="lesson-10-ui.js"></script>
  <script src="shell-layout.js"></script>
  <script src="southern-practice-ui.js"></script>
</body>
</html>
