<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#9a3042" />
  <meta name="description" content="Interactive Vietnamese for partners and in-laws, with separate Northern and Southern learning tracks." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vietnamese Family" />
  <title>Vietnamese for Family · 10-Lesson Course</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="course.css" />
  <link rel="stylesheet" href="lesson-8.css" />
  <link rel="stylesheet" href="lesson-9.css" />
  <link rel="stylesheet" href="lesson-10.css" />
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Vietnamese for Family home">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span>
        <strong>Vietnamese for Family</strong>
        <small>Learn the Vietnamese your family speaks.</small>
      </span>
    </a>
    <div class="header-actions">
      <button id="install-app" class="install-button" type="button" hidden>Install app</button>
      <div id="lesson-badge" class="lesson-badge">Lesson 1 · Meeting the Family</div>
    </div>
  </header>

  <main id="top">
    <nav id="course-nav" class="course-nav page-shell" aria-label="Course lessons"></nav>

    <section class="hero page-shell">
      <div class="hero-copy">
        <p id="hero-eyebrow" class="eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p id="hero-text" class="hero-text"></p>
      </div>

      <aside class="dialect-panel" aria-label="Dialect settings">
        <p class="setting-label">I want to learn</p>
        <div class="segmented" role="group" aria-label="Primary dialect">
          <button class="dialect-button" type="button" data-dialect="north">Northern</button>
          <button class="dialect-button" type="button" data-dialect="south">Southern</button>
        </div>
        <p id="dialect-summary" class="setting-summary"></p>
      </aside>
    </section>

    <section class="page-shell status-strip" aria-label="Lesson status">
      <div>
        <span class="status-label">Lesson progress</span>
        <strong id="progress-text">0%</strong>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
      <button id="reset-progress" class="text-button" type="button">Reset this lesson</button>
    </section>

    <section id="audio-note" class="page-shell audio-note" aria-label="Audio information">
      <span aria-hidden="true">🔊</span>
      <p><strong>Audio:</strong> <span id="audio-status"></span></p>
    </section>

    <div id="lesson-root" class="page-shell lesson-stack"></div>
  </main>

  <footer class="site-footer page-shell">
    <p>Vietnamese for Family · V0.10 · All 10 lessons playable</p>
    <p>Built for real conversations with your Vietnamese family.</p>
  </footer>

  <script src="course-data.js"></script>
  <script src="lesson-2.js"></script>
  <script src="lesson-7.js"></script>
  <script src="lesson-8.js"></script>
  <script src="lesson-9.js"></script>
  <script src="lesson-10.js"></script>
  <script src="regional-pronouns.js"></script>
  <script src="app.js"></script>
  <script src="audio-fix.js"></script>
  <script src="lesson-8-ui.js"></script>
  <script src="lesson-9-ui.js"></script>
  <script src="lesson-10-ui.js"></script>
</body>
</html>
