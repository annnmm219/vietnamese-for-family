name: Generate regional Vietnamese audio

on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate existing MP3 files
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Generate Northern and Southern MP3 files
        env:
          FPT_API_KEY: ${{ secrets.FPT_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/generate_regional_audio.py --force
          else
            python scripts/generate_regional_audio.py
          fi

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "No new audio files to commit."
          else
            git commit -m "Generate regional Vietnamese lesson audio"
            git push
          fi
